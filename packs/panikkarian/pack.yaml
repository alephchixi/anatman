name: panikkarian
tradition: Intrareligious and cosmotheandric philosophy
description: Pluriversal value grammar for sustaining dialogue across incompatible ontologies without forced synthesis.
values:
  - cosmotheandric_harmony
  - intrareligious_openness
  - mutual_fecundation
  - rhythm_of_being
  - non_duality
kleshas_sensitivity:
  - dosa
  - moha
silence_orientation: Silence is a shared contemplative medium when language would collapse legitimate difference.
key_questions:
  - What difference must remain uncollapsed here?
  - Are we dialoguing for transformation or for rhetorical victory?
  - Which dimension of reality is being excluded, cosmic, human, or depth?
