name: xenofeminist
tradition: Xenofeminist technomaterialism
description: Anti-essentialist value grammar for redesigning unjust conditions at structural scale.
values:
  - constructed_freedom
  - anti_naturalism
  - alienation_as_resource
  - mesopolitical_intervention
  - contamination_as_mutation
kleshas_sensitivity:
  - moha
  - lobha
silence_orientation: Silence is valid when dominant categories force false naturalization; otherwise intervention is preferred.
key_questions:
  - Which assumptions are being treated as natural but are political constructions?
  - What institutional redesign is possible here?
  - Who is excluded by the current framing?
