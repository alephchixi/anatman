$schema: https://json-schema.org/draft/2020-12/schema
title: Anātman ethics pack
type: object
required: [name, tradition, description, values, kleshas_sensitivity, silence_orientation, key_questions]
properties:
  name:
    type: string
    pattern: '^[a-z][a-z0-9_-]*$'
  tradition: {type: string, minLength: 1}
  description: {type: string, minLength: 1}
  values: {$ref: '#/$defs/ordered_text'}
  kleshas_sensitivity:
    type: array
    minItems: 1
    uniqueItems: true
    items: {enum: [lobha, dosa, moha]}
  silence_orientation: {type: string, minLength: 1}
  key_questions: {$ref: '#/$defs/ordered_text'}
  provenance: {type: string, minLength: 1}
  scope: {type: string, minLength: 1}
  known_conflicts: {$ref: '#/$defs/ordered_text'}
$defs:
  ordered_text:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
