version: 2
updates:
  - package-ecosystem: pip
    directories:
      - "/"
    schedule:
      interval: cron
      cronjob: "0 10 17 * *"
      timezone: America/Bogota
    open-pull-requests-limit: 1
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      compatible-pip:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # pre-commit 4.7 requires Python 3.11, and CI still validates 3.10.
      - dependency-name: pre-commit
        versions: [">=4.7"]
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: cron
      cronjob: "0 10 17 * *"
      timezone: America/Bogota
    open-pull-requests-limit: 1
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      compatible-github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
