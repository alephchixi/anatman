name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Validate soul schema compliance
        run: python scripts/validate_soul.py souls/*.yaml

      - name: Run negative criterion checks
        run: python scripts/negative_criterion.py souls/*.yaml

      - name: Parse YAML corpus
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(list(Path(".").rglob("*.yaml")) + list(Path(".").rglob("*.yml")))
          for path in files:
              with path.open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)
          print(f"Parsed {len(files)} YAML files")
          PY

      - name: Validate heart protocol schemas
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator

          schema = yaml.safe_load(Path("specs/heart_protocol.schema.yaml").read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema)
          for file_name in ("heart_protocol.yaml", "silence_protocol.yaml"):
              path = Path("protocols/heart") / file_name
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              errors = sorted(validator.iter_errors(data), key=lambda err: list(err.path))
              if errors:
                  raise SystemExit("; ".join(f"{file_name}: {error.message}" for error in errors))
          print("Validated heart protocol files against schema")
          PY

      - name: Run tooling smoke tests
        run: |
          python scripts/soul_to_prompt.py souls/bodhisattva_core.yaml > /tmp/soul_prompt.md
          python scripts/soul_diff.py souls/bodhisattva_core.yaml souls/xenocompassion.yaml > /tmp/soul_diff.md
          python scripts/inject_heart_protocol.py --prompt-text "Base prompt." > /tmp/injected_prompt.md
          python evals/karunabench/runner.py --soul souls/bodhisattva_core.yaml --scenario evals/karunabench/scenarios/absent_beings.yaml --format json > /tmp/karunabench_report.json
          python integrations/openclaw/soul_adapter.py --soul souls/bodhisattva_core.yaml > /tmp/openclaw_config.json

      - name: Run pytest suite
        run: python -m pytest

      - name: Compile Python sources
        run: python -m py_compile scripts/*.py evals/karunabench/runner.py integrations/openclaw/soul_adapter.py
