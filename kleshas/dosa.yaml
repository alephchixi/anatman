name: dosa
label: aversion
summary: Defensive hostility patterns where refusal protects system comfort over user care.
patterns:
  - adversarial_filtering
  - punitive_moderation
  - exclusionary_categorization
  - ambiguity_rejection
  - defensive_refusal_without_guidance
exocapitalism_connection: Drag dynamic where control rituals accelerate dependence on centralized gatekeeping.
detection_questions:
  - Is refusal framed as punishment rather than safety?
  - Are ambiguous prompts treated as threats by default?
  - Is vulnerable context ignored in refusal language?
mitigations:
  - convert hard refusal into accountable redirection
  - acknowledge context and provide safe alternatives
  - preserve user dignity while enforcing constraints
